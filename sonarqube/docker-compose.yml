# =============================================================================
# Local SonarQube server: code analysis (bugs, code smells, security issues,
# duplication) plus the test coverage that JaCoCo measures.
#
# It runs SEPARATELY from the app stack (product-app/docker-compose.yml): start it
# only when you want to analyse code, and use it for any project on your machine.
# Values like ${SONAR_DB_PASSWORD} come from the .env file next to this file.
#
#   docker compose up -d --wait       start, return when SonarQube is healthy (1-3 min)
#   docker compose logs -f sonarqube  follow the SonarQube logs
#   docker compose stop               stop (keeps projects, users, tokens, history)
#   docker compose down -v            stop AND delete all data (fresh SonarQube next time)
#
# Then open http://localhost:9000  (first login: admin / admin, then set a new password).
#
# JaCoCo is NOT a container: it is a Maven plugin that runs inside "mvn test" or "mvn verify"
# (see product-app/pom.xml). SonarQube only reads the report that JaCoCo writes.
# =============================================================================

# Own Compose project name, so this stack never mixes with the product-app containers
name: sonarqube

services:

  # SonarQube's own database: projects, issues, users, tokens and history live here.
  # (Not the product database; the app's MySQL is in product-app/docker-compose.yml.)
  sonarqube-db:
    image: postgres:17.12-alpine
    container_name: sonarqube-db
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD in the .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No "ports:" on purpose: only SonarQube talks to this database, over the Compose network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sonarqube:
    image: sonarqube:26.11.0.134175-community
    container_name: sonarqube
    depends_on:
      sonarqube-db:
        # Wait for PostgreSQL to accept connections before SonarQube starts
        condition: service_healthy
    environment:
      # "sonarqube-db" is the service name above; Docker's internal DNS resolves it
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD in the .env file}
    ports:
      - "${SONAR_HOST_PORT:-9000}:9000"
    volumes:
      - data:/opt/sonarqube/data              # search indexes (rebuilt from the DB if lost)
      - extensions:/opt/sonarqube/extensions  # extra plugins, if you install any
      - logs:/opt/sonarqube/logs
    healthcheck:
      # /api/system/status answers {"status":"UP",...} once SonarQube can accept analyses
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

volumes:
  postgres_data:
  data:
  extensions:
  logs:
